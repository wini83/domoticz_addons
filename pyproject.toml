[project]
name = "domoticz-addons"
version = "0.0.0"
description = "Legacy Domoticz add-ons and helper scripts"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
include = ["lib/pekaVmonitor.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
